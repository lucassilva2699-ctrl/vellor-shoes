/* ==================================================
   MENU DINÂMICO
================================================== */

.navigation-item {
    position: relative;
    display: flex;
    align-items: center;
}

.navigation-item > a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

.navigation-arrow {
    font-size: 10px;
    opacity: .7;
}

.navigation-dropdown {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);

    min-width: 230px;
    padding: 10px;

    background: #111114;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px;

    box-shadow: 0 18px 45px rgba(0,0,0,.35);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity .18s,
        visibility .18s,
        transform .18s;

    z-index: 9999;
}

.navigation-item:hover > .navigation-dropdown,
.navigation-item:focus-within > .navigation-dropdown {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform:
        translateX(-50%)
        translateY(0);
}

.navigation-dropdown .navigation-item {
    display: block;
}

.navigation-dropdown .navigation-item > a {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
}

.navigation-dropdown .navigation-item > a:hover {
    background: rgba(255,255,255,.07);
}

.navigation-dropdown .navigation-dropdown {
    top: -10px;
    left: 100%;
    transform: none;
}

.navigation-dropdown .navigation-item:hover > .navigation-dropdown,
.navigation-dropdown .navigation-item:focus-within > .navigation-dropdown {
    transform: translateY(0);
}
</style>

const navigation =
    document.getElementById("store-navigation");

let storeMenuItems = [];

function getMenuChildren(parentId) {

    return storeMenuItems
        .filter(item =>
            item.parentId === parentId
        )
        .sort(
            (a, b) =>
                Number(a.order || 0) -
                Number(b.order || 0)
        );
}

function buildMenuItem(item, isRoot = false) {

    const children =
        getMenuChildren(item.id);

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "navigation-item";

    const link =
        document.createElement("a");

    const itemName =
        String(item.name || "")
            .trim()
            .toLowerCase();

    link.href =
        (
            isRoot &&
            ["masculino", "feminino"].includes(itemName)
        )
            ? `categoria.html?menu=${encodeURIComponent(item.id)}&all=1`
            : `categoria.html?menu=${encodeURIComponent(item.id)}`;

    link.dataset.menuId = item.id;

    link.innerHTML = `
        <span>
            ${String(item.name || "")}
        </span>

        ${
            children.length
                ? '<span class="navigation-arrow">›</span>'
                : ""
        }
    `;

    wrapper.appendChild(link);

    if (children.length) {

        const dropdown =
            document.createElement("div");

        dropdown.className =
            "navigation-dropdown";

        children.forEach(child => {

            dropdown.appendChild(
                buildMenuItem(child)
            );

        });

        wrapper.appendChild(dropdown);
    }

    return wrapper;
}

async function loadStoreMenu() {

    if (!navigation) {
        return;
    }

    try {

        const menuRef =
            collection(db, "store_menu");

        const menuQuery =
            query(
                menuRef,
                where("active", "==", true)
            );

        const result =
            await getDocs(menuQuery);

        storeMenuItems = [];

        result.forEach(snapshot => {

            storeMenuItems.push({
                id: snapshot.id,
                ...snapshot.data()
            });

        });

        navigation.innerHTML = `
            <a
                href="index.html"
                data-home-link
            >
                Início
            </a>
        `;

        const rootItems =
            storeMenuItems
                .filter(item => !item.parentId)
                .sort((a, b) => {

                    const order = [
                        "masculino",
                        "feminino",
                        "acessórios",
                        "promocoes",
                        "promoções"
                    ];

                    const aName =
                        String(a.name || "")
                            .trim()
                            .toLowerCase();

                    const bName =
                        String(b.name || "")
                            .trim()
                            .toLowerCase();

                    return (
                        order.indexOf(aName) -
                        order.indexOf(bName)
                    );
                });

        rootItems.forEach(item => {

            navigation.appendChild(
                buildMenuItem(item, true)
            );

        });

    }
    catch (error) {

        console.error(
            "Erro ao carregar menu da loja:",
            error
        );

    }
}

        "click",

            const link =
                event.target.closest(
                    ".navigation-item > a"
                );

            if (!link) {
                return;
            }

            const item =
                link.parentElement;

            const submenu =
                item.querySelector(
                    ":scope > .navigation-dropdown"
                );

            if (!submenu) {
                return;
            }

            if (window.innerWidth <= 700) {

                event.preventDefault();

                item.classList.toggle(
                    "mobile-expanded"
                );
            }
        }
    );
}

window.vellorSearchProducts = async function (term) {

    const searchTerm =
        String(term || "")
            .trim()
            .toLowerCase();

    if (!searchTerm) {
        return [];
    }

    try {

        const productsRef =
            collection(db, "products");

        const productsQuery =
            query(
                productsRef,
                where("active", "==", true)
            );

        const result =
            await getDocs(productsQuery);

        const products = [];

        result.forEach((snapshot) => {

            const product =
                snapshot.data();

            const name =
                String(product.name || "")
                    .toLowerCase();

            const brand =
                String(product.brand || "")
                    .toLowerCase();

            const sku =
                String(product.sku || "")
                    .toLowerCase();

            if (
                name.includes(searchTerm) ||
                brand.includes(searchTerm) ||
                sku.includes(searchTerm)
            ) {

                products.push({
                    id: snapshot.id,
                    ...product
                });

            }

        });

        return products;

    } catch (error) {

        console.error(
            "Erro na busca de produtos:",
            error
        );

        return [];
    }
};

================================================== */

function initializeProductInteractions(
    product,
    id,
    price
) {

    let quantity = 1;

    let selectedSize = null;

    let selectedStock = 0;


    const quantityElement =
        document.getElementById("quantity");


    const sizeOptions =
        document.getElementById("size-options");


    /* ==================================================
       TAMANHOS
    ================================================== */

    const sizes =
        Array.isArray(product.sizes)
            ? product.sizes
            : [];


    if (sizes.length === 0) {

        sizeOptions.innerHTML = `
            <span>
                Tamanhos indisponíveis
            </span>
        `;

    } else {

        sizes.forEach(item => {

            const size = item.size;

            const stock =
                Number(item.stock || 0);


            const button =
                document.createElement("button");


            button.type = "button";

            button.className = "size-option";

            button.textContent = size;


            /* TAMANHO ESGOTADO */

            if (stock <= 0) {

                button.disabled = true;

                button.classList.add(
                    "out-of-stock"
                );

            }


            /* SELECIONAR TAMANHO */

            button.addEventListener(
                "click",
                () => {

                    if (stock <= 0) {
                        return;
                    }


                    document
                        .querySelectorAll(
                            ".size-option"
                        )
                        .forEach(item => {

                            item.classList.remove(
                                "selected"
                            );

                        });


                    button.classList.add(
                        "selected"
                    );


                    selectedSize = size;

                    selectedStock = stock;

                    quantity = 1;

                    quantityElement.textContent =
                        quantity;

                }
            );


            sizeOptions.appendChild(button);

        });

    }


    /* ==================================================
       DIMINUIR QUANTIDADE
    ================================================== */

    document.getElementById(
        "quantity-minus"
    ).addEventListener(
        "click",
        () => {

            if (quantity > 1) {

                quantity--;

                quantityElement.textContent =
                    quantity;

            }

        }
    );


    /* ==================================================
       AUMENTAR QUANTIDADE
    ================================================== */

    document.getElementById(
        "quantity-plus"
    ).addEventListener(
        "click",
        () => {

            if (
                selectedSize &&
                quantity < selectedStock
            ) {

                quantity++;

                quantityElement.textContent =
                    quantity;

            }

        }
    );


    /* ==================================================
       ADICIONAR AO CARRINHO
    ================================================== */

    document.getElementById(
        "add-to-cart"
    ).addEventListener(
        "click",
        () => {

            if (!selectedSize) {

                alert(
                    "Selecione um tamanho."
                );

                return;

            }


            /* BUSCAR CARRINHO ATUAL */

            let cart =
                JSON.parse(
                    localStorage.getItem(
                        "vellorCart"
                    )
                ) || [];


            /* PROCURAR ITEM IGUAL */

            const existingItem =
                cart.find(item =>
                    item.id === id &&
                    String(item.size) ===
                    String(selectedSize)
                );


            if (existingItem) {

                const newQuantity =
                    existingItem.quantity +
                    quantity;


                if (
                    newQuantity >
                    selectedStock
                ) {

                    alert(
                        `Você já possui ${existingItem.quantity} unidade(s) desse tamanho no carrinho. Estoque disponível: ${selectedStock}.`
                    );

                    return;

                }


                existingItem.quantity =
                    newQuantity;

            } else {

                cart.push({

                    id: id,

                    name:
                        product.name || "Produto",

                    brand:
                        product.brand || "",

                    price: price,

                    size: selectedSize,

                    quantity: quantity,

                    image:
                        product.image || ""

                });

            }


            /* SALVAR */

            localStorage.setItem(
                "vellorCart",
                JSON.stringify(cart)
            );


            /* ATUALIZAR CONTADOR */

            updateCartCount();


            /* CONFIRMAÇÃO */

            alert(
                `${product.name} foi adicionado ao carrinho.`
            );


            console.log(
                "Carrinho atual:",
                cart
            );

        }
    );




}

        /* ==================================================
           PRODUTOS RELACIONADOS
        ================================================== */

        async function loadRelatedProducts(
            category
        ) {

            if (!category) {

                return;

            }


            try {

                const productsRef =
                    collection(
                        db,
                        "products"
                    );


                const productsQuery =
                    query(
                        productsRef,
                        where(
                            "active",
                            "==",
                            true
                        ),
                        limit(4)
                    );


                const result =
                    await getDocs(
                        productsQuery
                    );


                relatedProducts.innerHTML =
                    "";


                result.forEach(
                    snapshot => {

                        if (
                            snapshot.id === productId
                        ) {

                            return;

                        }


                        const product =
                            snapshot.data();


                        const price =
                            Number(
                                product.price || 0
                            );


                        const card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "product-card";


                        card.innerHTML = `

                            <a
                                href="produto.html?id=${snapshot.id}"
                            >

                                <div class="product-image">

                                    <div class="product-placeholder">

                                        PRODUTO

                                    </div>

                                </div>


                                <div class="product-info">

                                    <span class="product-brand">

                                        ${product.brand || ""}

                                    </span>


                                    <h3>

                                        ${product.name || "Produto"}

                                    </h3>


                                    <strong>

                                        ${formatPrice(price)}

                                    </strong>

                                </div>

                            </a>

                        `;


                        relatedProducts.appendChild(
                            card
                        );

                    }
                );


            }
            catch (error) {

                console.error(
                    "Erro nos produtos relacionados:",
                    error
                );

            }

        }


        /* ==================================================
           ERRO
        ================================================== */

        function showProductError(
            message
        ) {

            productDetail.innerHTML = `

                <div class="products-empty">

                    <strong>
                        ${message}
                    </strong>

                    <a
                        href="index.html"
                        class="primary-button"
                    >
                        VOLTAR PARA A LOJA
                    </a>

                </div>

            `;

        }


        /* ==================================================
           INICIAR
        ================================================== */

        loadProduct();
